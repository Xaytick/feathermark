name: Release

# 触发方式：推送提交信息含 [release vX.Y.Z] 的提交到 main。
# 不用 tag 触发——否则每次打版本 tag 都会意外建 Release，而资产分支可能还没更新。
# 用 GitHub 内置的 GITHUB_TOKEN 创建 Release 并上传资产，无需外部 token。
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Parse version from commit message
        id: gate
        shell: bash
        run: |
          msg="${{ github.event.head_commit.message }}"
          if [[ "$msg" =~ \[release\ v([0-9]+\.[0-9]+\.[0-9]+)\] ]]; then
            echo "version=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout assets branch
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          ref: release-assets
          path: assets

      - name: Verify assets exist for this version
        if: steps.gate.outputs.go == 'true'
        shell: bash
        run: |
          v="${{ steps.gate.outputs.version }}"
          ls assets/dist/*-${v}-*.zip
          test -f "assets/dist/FeatherMark-${v}-macos-arm64.zip"
          test -f "assets/dist/FeatherMark-${v}-windows-x64.zip"

      - name: Remove stale assets from this release
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          v="${{ steps.gate.outputs.version }}"
          rel=$(gh api "repos/$GH_REPO/releases/tags/$v" --jq '.id' 2>/dev/null || true)
          if [ -z "$rel" ]; then echo "no existing release $v"; exit 0; fi
          gh api "repos/$GH_REPO/releases/$rel/assets" --jq '.[] | select(.name | contains("'"$v"'") | not) | .id' 2>/dev/null \
            | while read -r aid; do gh api -X DELETE "repos/$GH_REPO/releases/assets/$aid" && echo "deleted asset $aid"; done

      - name: Delete existing Release if present
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          v="${{ steps.gate.outputs.version }}"
          echo "Deleting release $v if it exists..."
          gh release delete "$v" --yes 2>/dev/null || true
          # 删掉可能残留的 tag（--cleanup-tag 有时因 tag 受保护失败）
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$v" 2>/dev/null || true

      - name: Create Release and upload assets
        if: steps.gate.outputs.go == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.gate.outputs.version }}
          name: FeatherMark ${{ steps.gate.outputs.version }}
          generate_release_notes: true
          body: |
            轻量跨平台 Markdown 编辑器（Tauri 2 + CodeMirror 5）。

            **下载**
            - macOS (Apple Silicon)：`FeatherMark-${{ steps.gate.outputs.version }}-macos-arm64.zip`，解压出 FeatherMark.app 拖进应用程序即可。
            - Windows x64：`FeatherMark-${{ steps.gate.outputs.version }}-windows-x64.zip`，绿色便携版，双击 feathermark.exe 运行（需 WebView2）。

            两个平台均未签名，首次打开可能需要在系统设置里允许。
          files: |
            assets/dist/FeatherMark-${{ steps.gate.outputs.version }}-macos-arm64.zip
            assets/dist/FeatherMark-${{ steps.gate.outputs.version }}-windows-x64.zip
