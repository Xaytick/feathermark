<!DOCTYPE html>
<html lang="zh-CN" data-mode="light" data-scheme="ink">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeatherMark</title>
  <link rel="stylesheet" href="lib/codemirror/codemirror.css" />
  <link rel="stylesheet" href="lib/katex/katex.min.css" />
  <link rel="stylesheet" href="lib/hljs-github.css" id="hljs-light" />
  <link rel="stylesheet" href="lib/hljs-github-dark.css" id="hljs-dark" disabled />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="booting">
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2.75h7.2L19 8.55V21.25H6z" /><path d="M13 2.9v5.8h5.8" /></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5h6l1.6 2H21V19H3z" /></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
    <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3 7h6l1.6 2H20l-2 9H4z" /><path d="M3 7v11" /></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" /><path d="M15 15l5 5" /></symbol>
    <symbol id="i-outline" viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h12" /></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 3v2.5M12 18.5V21M4.2 7.5l2.2 1.3M17.6 15.2l2.2 1.3M4.2 16.5l2.2-1.3M17.6 8.8l2.2-1.3" /></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19" /></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8.5 8.5 0 1020 14.5z" /></symbol>
    <symbol id="i-split" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M12 4v16" /></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4" /></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12z" /><circle cx="12" cy="12" r="2.6" /></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4" /><path d="M4.5 15v4.5h15V15" /></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4.5h11L19.5 8v11.5h-15z" /><path d="M8.5 4.5v5h7v-5M8.5 19v-5.5h7V19" /></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4" /><circle cx="12" cy="12" r="1.4" /><circle cx="18" cy="12" r="1.4" /></symbol>
    <symbol id="i-feather" viewBox="0 0 24 24"><path d="M4 20c0-8 5-14 16-16 0 8-6 14-16 16z" /><path d="M4 20l6-6" /></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
    <symbol id="i-max" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5" /></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5.5h16v11H9l-5 3z" /><path d="M8 9.5h8M8 12.5h5" /></symbol>
    <symbol id="i-attach" viewBox="0 0 24 24"><path d="M9 12.5l5-5a3 3 0 114.2 4.2l-7.5 7.5a5 5 0 01-7-7l8-8" /></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-6z" /><path d="M11 14l5-5" /></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14" /></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V5H5v11h3" /></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.7 4.6L18 9.3l-4.3 1.7L12 15.6l-1.7-4.6L6 9.3l4.3-1.7z" /><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" /></symbol>
  </svg>

  <div id="app">
    <!-- 标题栏：macOS 用系统红绿灯（左侧留白），Windows/Linux 用右侧自绘按钮 -->
    <header id="titlebar" data-tauri-drag-region>
      <div class="tb-brand" data-tauri-drag-region>
        <svg class="logo" viewBox="0 0 24 24"><use href="#i-feather" /></svg>
      </div>
      <div id="tabstrip" class="tabstrip"></div>
      <div class="tb-actions">
        <button class="icon-btn" id="btn-new" title="新建 (⌘N)"><svg viewBox="0 0 24 24"><use href="#i-plus" /></svg></button>
        <button class="icon-btn" id="btn-open" title="打开文件 (⌘O)"><svg viewBox="0 0 24 24"><use href="#i-file" /></svg></button>
        <button class="icon-btn" id="btn-folder" title="打开文件夹"><svg viewBox="0 0 24 24"><use href="#i-folder" /></svg></button>
        <span class="tb-sep"></span>
        <button class="icon-btn" id="btn-mode-editor" title="仅编辑"><svg viewBox="0 0 24 24"><use href="#i-code" /></svg></button>
        <button class="icon-btn" id="btn-mode-split" title="分屏"><svg viewBox="0 0 24 24"><use href="#i-split" /></svg></button>
        <button class="icon-btn" id="btn-mode-preview" title="仅预览"><svg viewBox="0 0 24 24"><use href="#i-eye" /></svg></button>
        <span class="tb-sep"></span>
        <button class="icon-btn" id="btn-chat" title="Agent 对话 (⌘L)"><svg viewBox="0 0 24 24"><use href="#i-chat" /></svg></button>
        <button class="icon-btn" id="btn-theme" title="切换主题"><svg viewBox="0 0 24 24"><use href="#i-moon" /></svg></button>
        <button class="icon-btn" id="btn-menu" title="更多"><svg viewBox="0 0 24 24"><use href="#i-more" /></svg></button>
      </div>
      <div class="win-controls" id="win-controls">
        <button data-win="minimize" title="最小化"><svg viewBox="0 0 24 24"><use href="#i-minus" /></svg></button>
        <button data-win="toggle-maximize" title="最大化"><svg viewBox="0 0 24 24"><use href="#i-max" /></svg></button>
        <button data-win="close" class="win-close" title="关闭"><svg viewBox="0 0 24 24"><use href="#i-close" /></svg></button>
      </div>
    </header>

    <div id="body">
      <aside id="sidebar">
        <div class="side-tabs" role="tablist">
          <button class="side-tab active" data-pane="files" title="文件">文件</button>
          <button class="side-tab" data-pane="outline" title="大纲">大纲</button>
          <button class="side-tab" data-pane="search" title="搜索">搜索</button>
        </div>
        <div class="side-body">
          <div class="pane active" data-pane="files">
            <div class="pane-head">
              <span id="workspace-name" class="pane-title">未打开文件夹</span>
              <button class="mini-btn" id="btn-tree-refresh" title="刷新">⟳</button>
            </div>
            <div id="tree" class="tree"></div>
          </div>
          <div class="pane" data-pane="outline">
            <div class="pane-head"><span class="pane-title">大纲</span></div>
            <div id="outline" class="outline"></div>
          </div>
          <div class="pane" data-pane="search">
            <div class="pane-head"><span class="pane-title">工作区搜索</span></div>
            <div class="search-bar">
              <input id="search-input" type="search" placeholder="搜索内容…" spellcheck="false" />
              <label class="chk" title="区分大小写"><input type="checkbox" id="search-case" />Aa</label>
            </div>
            <div id="search-results" class="search-results"></div>
          </div>
        </div>
      </aside>

      <div id="splitter-side" class="splitter vertical"></div>

      <main id="workspace">
        <div id="editor-pane">
          <div id="editor-host">
            <textarea id="editor" spellcheck="false"></textarea>
          </div>
          <div id="empty-state" class="empty-state">
            <svg class="empty-logo" viewBox="0 0 24 24"><use href="#i-feather" /></svg>
            <div class="empty-title">FeatherMark</div>
            <div class="empty-sub">轻量 · 跨平台 · Markdown</div>
            <div class="empty-actions">
              <button class="btn" id="empty-new">新建文档 <kbd>⌘N</kbd></button>
              <button class="btn ghost" id="empty-open">打开文件 <kbd>⌘O</kbd></button>
              <button class="btn ghost" id="empty-folder">打开文件夹</button>
            </div>
            <div id="recent-list" class="recent-list"></div>
          </div>
        </div>

        <div id="splitter-main" class="splitter horizontal"></div>

        <section id="preview-pane">
          <div id="preview-scroll">
            <article id="preview" class="markdown-body"></article>
          </div>
        </section>
      </main>

      <div id="splitter-chat" class="splitter vertical chat-splitter hidden"></div>

      <aside id="chat-panel" class="hidden" aria-label="Agent 对话">
        <header class="chat-head">
          <div class="chat-head-title">
            <svg viewBox="0 0 24 24"><use href="#i-spark" /></svg>
            <span>Agent</span>
          </div>
          <div class="chat-head-actions">
            <button class="mini-btn" id="chat-new" title="新建会话"><svg viewBox="0 0 24 24"><use href="#i-plus" /></svg></button>
            <button class="mini-btn" id="chat-templates" title="问题模板">模板</button>
            <button class="mini-btn" id="chat-skills" title="Skills">技能</button>
            <button class="mini-btn" id="chat-close" title="收起 (⌘L)"><svg viewBox="0 0 24 24"><use href="#i-close" /></svg></button>
          </div>
        </header>

        <div class="chat-session-bar">
          <span class="chat-session-label">会话</span>
          <button class="mini-btn" id="chat-sessions-toggle" title="展开/收起会话列表">⌄</button>
        </div>
        <div id="chat-sessions" class="chat-sessions"></div>

        <div id="chat-messages" class="chat-messages">
          <div class="chat-empty" id="chat-empty">
            <svg viewBox="0 0 24 24"><use href="#i-spark" /></svg>
            <div class="chat-empty-title">和 Agent 一起编辑</div>
            <div class="chat-empty-sub">问问题、粘贴选区，或拖入文件与图片。回复可一键写回编辑器。</div>
            <div class="chat-empty-actions">
              <button class="btn ghost" data-template="polish">润色当前选区</button>
              <button class="btn ghost" data-template="explain">解释这段代码</button>
              <button class="btn ghost" data-template="layout">整理排版</button>
            </div>
          </div>
        </div>

        <div class="chat-compose">
          <div class="chat-context-row">
            <button class="chat-chip" id="chat-context-btn" title="切换是否携带当前文档上下文">上下文：当前文档</button>
            <button class="chat-chip" id="chat-skill-chip" title="当前使用的 skill">无技能</button>
          </div>
          <div id="chat-attachments" class="chat-attachments"></div>
          <div class="chat-input-wrap">
            <textarea id="chat-input" rows="3" placeholder="问点什么…  ⌘↵ 发送" spellcheck="false"></textarea>
          </div>
          <div class="chat-compose-actions">
            <button class="mini-btn" id="chat-attach" title="添加文件或图片"><svg viewBox="0 0 24 24"><use href="#i-attach" /></svg></button>
            <span class="chat-hint" id="chat-hint">⌘↵ 发送</span>
            <button class="btn" id="chat-send"><svg viewBox="0 0 24 24"><use href="#i-send" /></svg> 发送</button>
          </div>
        </div>
      </aside>
    </div>

    <footer id="statusbar">
      <div class="sb-left">
        <span id="sb-path" class="sb-item">未命名</span>
        <span id="sb-dirty" class="sb-item dirty hidden">● 未保存</span>
      </div>
      <div class="sb-right">
        <span id="sb-words" class="sb-item">0 字</span>
        <span id="sb-cursor" class="sb-item">行 1, 列 1</span>
        <button class="sb-btn" id="sb-chat" title="Agent 对话 (⌘L)">Agent</button>
        <button class="sb-btn ai-btn" id="sb-ai" title="AI 编辑 (⌘J)">AI 编辑</button>
        <button class="sb-btn" id="sb-wrap" title="自动换行">换行</button>
        <button class="sb-btn" id="sb-split-dir" title="切换分屏方向">左右</button>
        <button class="sb-btn" id="sb-sidebar" title="侧边栏">侧栏</button>
      </div>
    </footer>
  </div>

  <!-- 文档内查找替换 -->
  <div id="findbar" class="findbar hidden">
    <input id="find-input" type="text" placeholder="查找" spellcheck="false" />
    <span id="find-count" class="find-count"></span>
    <input id="replace-input" type="text" placeholder="替换为" spellcheck="false" />
    <button class="mini-btn" id="find-prev" title="上一个 (⇧↵)">↑</button>
    <button class="mini-btn" id="find-next" title="下一个 (↵)">↓</button>
    <button class="mini-btn" id="find-replace" title="替换">替换</button>
    <button class="mini-btn" id="find-replace-all" title="全部替换">全部</button>
    <button class="mini-btn" id="find-close" title="关闭 (Esc)">✕</button>
  </div>

  <!-- 快速打开 -->
  <div id="quickopen" class="overlay hidden">
    <div class="quickopen-box">
      <input id="quickopen-input" type="text" placeholder="按文件名跳转…" spellcheck="false" />
      <div id="quickopen-list" class="quickopen-list"></div>
    </div>
  </div>

  <!-- 设置 -->
  <div id="settings" class="overlay hidden">
    <div class="settings-box">
      <header class="settings-head">
        <h2>设置</h2>
        <button class="mini-btn" id="settings-close">✕</button>
      </header>
      <div class="settings-body" id="settings-body"></div>
      <footer class="settings-foot">
        <button class="btn ghost" id="settings-reset">恢复默认</button>
        <span class="settings-hint">改动即时生效并保存在本地</span>
      </footer>
    </div>
  </div>

  <!-- AI 编辑 -->
  <div id="ai-dialog" class="overlay hidden">
    <div class="ai-box">
      <header class="ai-head">
        <div class="ai-title">
          <svg viewBox="0 0 24 24" class="ai-spark"><path d="M12 3l1.7 4.6L18 9.3l-4.3 1.7L12 15.6l-1.7-4.6L6 9.3l4.3-1.7z" /><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" /></svg>
          AI 编辑
        </div>
        <span id="ai-scope" class="ai-scope"></span>
        <button class="mini-btn" id="ai-close" title="关闭 (Esc)">✕</button>
      </header>

      <div class="ai-chips" id="ai-chips"></div>

      <div class="ai-input-row">
        <input id="ai-instruction" type="text" spellcheck="false"
               placeholder="补充要求（可选）：例如「保持学术语气」「术语不要翻译」" />
      </div>

      <div class="ai-body">
        <div class="ai-hint" id="ai-hint">
          选好动作后点「生成」。只把下面标明的范围发给模型，先看差异再决定应用。
        </div>
        <div class="ai-diff hidden" id="ai-diff"></div>
      </div>

      <footer class="ai-foot">
        <span class="ai-meta" id="ai-meta"></span>
        <div class="ai-foot-actions">
          <button class="btn ghost" id="ai-cancel">取消</button>
          <button class="btn ghost" id="ai-regen">重新生成</button>
          <button class="btn" id="ai-generate">生成</button>
          <button class="btn ghost hidden" id="ai-apply-all">全部替换</button>
          <button class="btn success hidden" id="ai-apply">应用替换</button>
        </div>
      </footer>
    </div>
  </div>

  <div id="menu-popover" class="popover hidden"></div>
  <div id="ctx-menu" class="popover ctx-menu hidden"></div>
  <div id="toast-host" class="toast-host"></div>

  <script src="lib/codemirror/codemirror.js"></script>
  <script src="lib/codemirror/mode/xml.js"></script>
  <script src="lib/codemirror/mode/markdown.js"></script>
  <script src="lib/codemirror/mode/javascript.js"></script>
  <script src="lib/codemirror/mode/css.js"></script>
  <script src="lib/codemirror/mode/htmlmixed.js"></script>
  <script src="lib/codemirror/mode/yaml.js"></script>
  <script src="lib/codemirror/mode/meta.js"></script>
  <script src="lib/codemirror/addon/continuelist.js"></script>
  <script src="lib/codemirror/addon/closebrackets.js"></script>
  <script src="lib/codemirror/addon/active-line.js"></script>
  <script src="lib/codemirror/addon/searchcursor.js"></script>
  <script src="lib/codemirror/addon/foldcode.js"></script>
  <script src="lib/codemirror/addon/foldgutter.js"></script>
  <script src="lib/codemirror/addon/markdown-fold.js"></script>
  <script src="lib/codemirror/addon/comment.js"></script>
  <script src="lib/codemirror/addon/placeholder.js"></script>
  <script src="lib/katex/katex.min.js"></script>
  <script src="lib/katex/auto-render.min.js"></script>
  <script src="lib/unified-bundle.js"></script>
  <script src="lib/app-bundle.js"></script>
</body>
</html>
